schema: '2.0'
stages:
  deploy-local:
    cmd:
    - fastapi dev api_local.py
    deps:
    - path: ../deploy_check.py
      hash: md5
      md5: e106c5a7111cb4a83873fe62f2324603
      size: 3496
    - path: ../models/production/model_prod.onnx
      hash: md5
      md5: ab600a4792f15bb51b3adae064e46458
      size: 111400
    - path: api_local.py
      hash: md5
      md5: 463632b5d7ca0d19ed1b45cccb1bea09
      size: 6795
    params:
      ../params.yaml:
        base:
          data_dir: data
          models_dir: models
          monitor_dir: results/monitor
          random_seed: 42
          results_dir: results/evaluate
        data:
          X_test: test_data/X_test.npy
          X_train: train_data/X_train.npy
          categorical_columns:
          - Gender
          - Country
          - Occupation
          - self_employed
          - family_history
          - Days_Indoors
          - Growing_Stress
          - Changes_Habits
          - Mental_Health_History
          - Mood_Swings
          - Coping_Struggles
          - Work_Interest
          - Social_Weakness
          - care_options
          clean_data: clean_data/clean_data.csv
          clean_data_dir: data/clean_data
          cols_to_drop:
          - mental_health_interview
          - Timestamp
          features_used:
          - Gender
          - Country
          - Occupation
          - self_employed
          - family_history
          - Days_Indoors
          - Growing_Stress
          - Changes_Habits
          - Mental_Health_History
          - Mood_Swings
          - Coping_Struggles
          - Work_Interest
          - Social_Weakness
          - care_options
          num_features: 14
          pred: prediction/prediction.csv
          pred_column: prediction
          preprocessor: preprocessor.pkl
          raw_data: m_health_dataset.csv
          ref_data: ref_data/ref_data.csv
          ref_data_dir: data/ref_data
          test_data_dir: data/test_data
          test_unscaled: test_data/test_unscaled.csv
          train_data_dir: data/train_data
          train_unscaled: train_data/train_unscaled.csv
          y_column: treatment
          y_test: test_data/y_test.csv
          y_train: train_data/y_train.csv
        evaluate:
          conf_matrix: yes
          expl_plot: yes
          metrics: metrics.json
          model_performance: model_performance.json
          model_onnx: model.onnx
  update-dvc:
    cmd:
    - dvc commit
    - dvc push
