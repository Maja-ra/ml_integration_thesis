stages: # for docker production deployment
  build-image:
    cmd: docker build -f ../Dockerfile -t ${docker.image_registry}:latest ../
    deps:
    - api.py
    - ../Dockerfile
    - ../.dockerignore
    - ../deploy_check.py
    - ../models/production/model_prod.onnx
    params:
    - docker
    always_changed: true
  run-container: 
    params:
    - docker
    cmd: 
    - docker push ${docker.image_registry}:latest
    - docker compose up -d
    #- docker run --name ${docker.local_container} -d --restart=always -p 8000:8000 ${docker.local_image_name}
    always_changed: true
  integration-test:
    cmd: 
    - python -m pytest ../tests/test_api.py
    deps:
    - ../tests/test_api.py
    - api.py
    always_changed: true
  update-dvc:
    cmd: 
    - dvc commit
    - dvc push
    always_changed: true
  