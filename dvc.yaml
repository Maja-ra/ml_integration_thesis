stages:
  clean:
    cmd: python src/clean_data.py
    deps:
      - data/m_health_dataset.csv
      - src/clean_data.py
    params:
      - data
    outs: #Stage outputs are files (or directories) written by pipelines
      - data/clean_data/clean_data.csv
  prepare: 
    cmd: python src/prepare_data.py
    deps:
      - data/clean_data/clean_data.csv
      - src/prepare_data.py
    params: 
      - data_split
      - data
      - base
    outs:
      - data/test_data/X_test.npy
      - data/train_data/X_train.npy
      - data/test_data/y_test.csv
      - data/train_data/y_train.csv
      - data/test_data/test_unscaled.csv
      - data/train_data/train_unscaled.csv
      - models/preprocessor.pkl
  monitor:
    cmd: python src/monitor.py
    deps:
    - src/monitor.py
    - data/train_data/train_unscaled.csv
    - data/ref_data/ref_data.csv
    params:
    - monitor
    - base
    - data
    outs:
    - results/monitor/drift_report.json
    - results/monitor/summary_report.json
  train:
    cmd: python src/train_model.py
    deps:
      - src/train_model.py
      - data/train_data/X_train.npy
      - data/train_data/y_train.csv
    params: # from params.yaml
      - base
      - data
      - train
    outs:
    - models/model.pkl
    #- results/train
  evaluate:
    cmd: python src/evaluate_model.py
    deps:
    - data/test_data/X_test.npy
    - data/test_data/y_test.csv
    - models/model.pkl
    - src/evaluate_model.py
    - models/preprocessor.pkl
    params:
    - evaluate
    - data
    - base
    outs:
    - results/evaluate
    - models/model.onnx
  deploy-check:
    cmd: python deploy_check.py
    deps:
    - results/monitor/drift_report.json
    - results/evaluate/model_performance.json
    - deploy_check.py
    params:
    - base
    - evaluate
    - monitor
    - environment

