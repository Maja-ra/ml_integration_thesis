stages:
  clean:
    cmd: python src/clean_data.py
    deps:
      - data/m_health_dataset.csv
      - src/clean_data.py
    params:
      - data
    outs: #Stage outputs are files (or directories) written by pipelines
      - data/clean_data/clean_data.csv
  prepare: 
    cmd: python src/prepare_data.py
    deps:
      - data/clean_data/clean_data.csv
      - src/prepare_data.py
    params: 
      - data_split
      - data
      - base
    outs:
      - data/test_data/X_test.npy
      - data/train_data/X_train.npy
      - data/test_data/y_test.csv
      - data/train_data/y_train.csv
  train:
    cmd: python src/train_model.py
    deps:
      - src/train_model.py
      - data/train_data/X_train.npy
      - data/train_data/y_train.csv
    params: # from params.yaml
      - base
      - data
      - train
    outs:
    - models/model.pkl
    #- results/train
  evaluate:
    cmd: python src/evaluate_model.py
    deps:
    - data/test_data/X_test.npy
    - data/test_data/y_test.csv
    - models/model.pkl
    - src/evaluate_model.py
    params:
    - evaluate
    - data
    outs:
    - results/evaluate
    - models/model.onnx